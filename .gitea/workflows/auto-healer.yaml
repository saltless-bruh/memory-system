# .gitea/workflows/auto-healer.yaml
# Vault mechanical verification + PR-first auto-healer (Technical_Blueprint_Auto_Healer_CICD.md).
#
# Two triggers, matching scout/healer.py's two modes:
#   • pull_request  -> `--ci`: heal drift in the analyst's PR by committing a bot
#                      fix onto THAT PR branch; the human reviews before merge.
#   • schedule      -> `--push`: sweep already-merged content; the healer opens
#                      its OWN heal PR off main (never commits to main directly).
#
# Runner: use a SELF-HOSTED runner that can reach the company LiteLLM gateway
# and the PostgreSQL V2 database, but is not exposed to the public internet.

name: Vault Verification & Auto-Healer

on:
  pull_request:
    paths:
      - 'wiki/**/*.md'
  schedule:
    - cron: '0 0 * * 0'   # weekly sweep, Sunday 00:00

permissions:
  contents: write
  pull-requests: write

jobs:
  # ---------------------------------------------------------------------------
  # PR path: trusted base code treats the PR checkout only as untrusted data.
  # No Python, dependency metadata, workflow, action, or shell file from the PR
  # checkout is ever executed on this secret-bearing self-hosted runner.
  # ---------------------------------------------------------------------------
  pr-heal:
    if: github.event_name == 'pull_request'
    runs-on: self-hosted
    env:
      HEALER_BACKEND: pgvector
      POSTGRES_HOST: ${{ vars.POSTGRES_HOST || 'postgres' }}
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${{ vars.POSTGRES_DB || 'snp_rag' }}
      POSTGRES_QUERY_USER: rag_app_role
      POSTGRES_QUERY_PASSWORD: ${{ secrets.POSTGRES_QUERY_PASSWORD }}
      LITELLM_BASE_URL: ${{ vars.LITELLM_BASE_URL || 'http://litellm:4000/v1' }}
      LITELLM_MASTER_KEY: ${{ secrets.LITELLM_MASTER_KEY }}
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://internal-telemetry:4317"
    steps:
      - name: Checkout immutable trusted base code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout exact untrusted PR objects without executing them
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.BOT_TOKEN }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr-source
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install trusted base dependencies
        working-directory: trusted
        run: uv sync --frozen --extra dev

      - name: Validate and materialize wiki-only PR data
        working-directory: trusted
        run: >-
          uv run python scripts/materialize_pr_wiki.py import
          --source ../pr-source
          --destination .
          --base-sha ${{ github.event.pull_request.base.sha }}
          --head-sha ${{ github.event.pull_request.head.sha }}

      - name: Create isolated trusted validation branch
        working-directory: trusted
        run: git switch -c "trusted/pr-${{ github.run_id }}"

      - name: Verify, heal once, and close the loop
        working-directory: trusted
        run: uv run python scripts/ci_address_gate.py --mode pr

      - name: Export verified Markdown bytes without copying executable files
        working-directory: trusted
        run: >-
          uv run python scripts/materialize_pr_wiki.py export
          --source .
          --destination ../pr-source

      - name: Commit and push bot fix (single commit to the PR branch)
        working-directory: pr-source
        env:
          PR_HEAD_REF: ${{ github.head_ref }}
        run: |
          git config user.name  "SNP Vault Healer Bot"
          git config user.email "bot@snp-memory.local"
          git add -- wiki/
          if git diff --cached --quiet; then
            echo "Healer produced no changes to commit."
          else
            git commit -m "bot: auto-heal drifted RAG citation(s) [skip ci]"
            git push origin "HEAD:${PR_HEAD_REF}"
          fi

  # ---------------------------------------------------------------------------
  # Scheduled sweep: drift in already-merged content -> healer opens a heal PR
  # ---------------------------------------------------------------------------
  scheduled-sweep:
    if: github.event_name == 'schedule'
    runs-on: self-hosted
    env:
      HEALER_BACKEND: pgvector
      POSTGRES_HOST: ${{ vars.POSTGRES_HOST || 'postgres' }}
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${{ vars.POSTGRES_DB || 'snp_rag' }}
      POSTGRES_QUERY_USER: rag_app_role
      POSTGRES_QUERY_PASSWORD: ${{ secrets.POSTGRES_QUERY_PASSWORD }}
      LITELLM_BASE_URL: ${{ vars.LITELLM_BASE_URL || 'http://litellm:4000/v1' }}
      LITELLM_MASTER_KEY: ${{ secrets.LITELLM_MASTER_KEY }}
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://internal-telemetry:4317"
      GITHUB_TOKEN: ${{ secrets.BOT_TOKEN }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.BOT_TOKEN }}
          ref: main
          fetch-depth: 0

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv and dependencies
        run: curl -LsSf https://astral.sh/uv/install.sh | sh && uv sync --extra dev

      - name: Security vulnerability audit (pip-audit)
        run: uv run --with pip-audit pip-audit

      - name: Configure bot identity
        run: |
          git config user.name  "SNP Vault Healer Bot"
          git config user.email "bot@snp-memory.local"

      - name: Choose scheduled heal branch
        run: echo "HEAL_BRANCH=heal/addresses-${{ github.run_id }}" >> "$GITHUB_ENV"

      - name: Verify, heal, reverify, commit, and push branch
        run: uv run python scripts/ci_address_gate.py --mode scheduled --branch "$HEAL_BRANCH"

      - name: Detect whether a heal branch was created
        run: |
          if git show-ref --verify --quiet "refs/heads/$HEAL_BRANCH"; then
            echo "HEAL_CREATED=true" >> "$GITHUB_ENV"
          fi

      - name: Open human-reviewed heal pull request
        if: env.HEAL_CREATED == 'true'
        env:
          GITEA_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: |
          payload=$(python -c 'import json,os; print(json.dumps({"base":"main","head":os.environ["HEAL_BRANCH"],"title":"heal: repair verified RAG addresses","body":"Automated scoped address repair. Human review and merge are required."}))')
          curl --fail-with-body --silent --show-error \
            -H "Authorization: token $GITEA_TOKEN" \
            -H "Content-Type: application/json" \
            --data "$payload" \
            "${{ github.server_url }}/api/v1/repos/${{ github.repository }}/pulls"
