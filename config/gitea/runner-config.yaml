# Gitea Actions Runner Configuration (Technical_Blueprint_Auto_Healer_CICD.md)
log:
  level: info

runner:
  file: .runner
  capacity: 2
  timeout: 3h
  insecure: false
  fetch_timeout: 5s
  fetch_interval: 2s
  labels:
    - "self-hosted:docker://catthehacker/ubuntu:act-22.04"
    - "ubuntu-latest:docker://catthehacker/ubuntu:act-22.04"

cache:
  enabled: true
  dir: /cache

container:
  network: "snp-memory_default"
  privileged: false
  options:
  workdir_parent:
  valid_volumes: []
  docker_host: ""
  force_pull: false
