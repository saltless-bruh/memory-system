# SNP Memory System — Docker Compose (R-9.1) — FULL STACK (T-3.8)
#
# Core services:
#   git              Gitea version/audit trail (optional when Git is external)
#   litellm          cloud model and embedding gateway
#   postgres         PostgreSQL 16 + pgvector, published to loopback only
#   postgres-migrate one-shot schema migration and role provisioning
#   scout            authenticated RAG bridge and sole query path to PostgreSQL
#   sync-job         raw/ ingestion through the dedicated ingest role
#   host-sync        isolated Git-to-replica publisher
#
# R-9.2: the wiki vault is plain Git content. host-sync publishes immutable
# snapshots into a named volume; scout mounts that replica read-only.
#
# Bring-up prerequisite: Ensure you have populated `.env` with your 
# Cloud API keys (OPENAI_API_KEY, etc.) and model settings. 
# `docker compose up -d` then builds the stack.

name: snp-memory

services:
  # ── Git backend — version + audit trail (R-1.1) ───────────────────
  # R-9.3: if the company already runs GitLab, delete this service and
  # point WIKI_REMOTE at the existing GitLab repo. Nothing else changes.
  git:
    image: gitea/gitea:1.24@sha256:918955f16b1e91732af6c449bb2db3a34271748dbed1ccfbae48f8a2fb5480b8
    restart: unless-stopped
    environment:
      USER_UID: "1000"
      USER_GID: "1000"
      GITEA__database__DB_TYPE: sqlite3
      GITEA__server__ROOT_URL: ${GITEA__server__ROOT_URL:-http://localhost:3000/}
      GITEA__server__DISABLE_SSH: "false"
      GITEA__server__SSH_PORT: ${GITEA_SSH_PORT:-2222}
      # Gitea itself has no provider/model egress requirement.
      GITEA__service__DISABLE_REGISTRATION: "true"
      GITEA__security__INSTALL_LOCK: "true"
      # Gitea refuses to deliver webhooks to private addresses by default
      # (ALLOWED_HOST_LIST defaults to `external`), and every address on a
      # compose network is private. The hook to host-sync was configured,
      # active, and reachable, and Gitea still dropped every delivery with
      # "webhook can only call allowed HTTP servers". That silently breaks
      # acceptance workflow W-2: the push succeeds, the task is queued, and
      # nothing tells the author their edit never reached the index.
      # Named rather than `private` or `*` so this permits exactly one
      # target and a second service cannot inherit egress by accident.
      GITEA__webhook__ALLOWED_HOST_LIST: host-sync
    volumes:
      - gitea-data:/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "127.0.0.1:${GITEA_HTTP_PORT:-3000}:3000"
      - "127.0.0.1:${GITEA_SSH_PORT:-2222}:22"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/api/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  # ── LiteLLM — the single model chokepoint (R-8.1) ─────────────────
  # Every model call made BY THE SYSTEM goes through here and lands on a
  # Cloud API provider (OpenAI, Anthropic, Gemini). 
  # Exception:
  #   1. The member's own coding-agent model is OUTSIDE this boundary
  # V3 removed the second exception: basic-memory's in-process FastEmbed was a
  # second vector space (384-dim against a 1024-dim index), so identical queries
  # returned different orderings. One engine now, and it routes through here.
  litellm:
    image: ghcr.io/berriai/litellm:main-stable@sha256:af806882b7a6ced41658db5b6a7e98ed7b9b51d03b935e0417bf1c8552d688af
    restart: unless-stopped
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?set LITELLM_MASTER_KEY}
      LITELLM_EMBED_MODEL: ${LITELLM_EMBED_MODEL:-text-embedding-3-small}
      LITELLM_LLM_MODEL: ${LITELLM_LLM_MODEL:-gpt-4o}
      LITELLM_VLM_MODEL: ${LITELLM_VLM_MODEL:-gpt-4o}
      LITELLM_JUDGE_ROUTE_MODEL: ${LITELLM_JUDGE_ROUTE_MODEL:-openrouter/z-ai/glm-5.2:free}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    volumes:
      - ./config/litellm/config.yaml:/app/config.yaml:ro
    ports:
      - "127.0.0.1:${LITELLM_PORT:-4000}:4000"
    healthcheck:
      # Liveliness alone is NOT enough: the proxy answers 200 even when every
      # configured model group 404s upstream (a retired model reports healthy).
      # /health runs the real per-deployment check, so "healthy" means the
      # probed routes actually resolve.
      #
      # Gate on the routes the stack cannot run without, and only those.
      # `sync-job` waits on `condition: service_healthy` here, so every group
      # named below can stop ingestion. snp-vlm is optional (nothing consumes it
      # yet) and snp-judge runs on a free-tier key: gating on either would let a
      # route nobody is calling take down the corpus. Both are still visible in
      # `GET /health` — reported, not load-bearing.
      #
      # With `background_health_checks` on, `?model=` filters the cached result
      # rather than issuing a live request, so this probe costs no tokens at any
      # interval. It answers 503 when the targeted group has no healthy
      # deployment, which is a distinct case from the endpoint being unreachable
      # and is handled as such below.
      #
      # The litellm image ships python but NOT curl, so probe via urllib.
      test:
        - CMD
        - python
        - -c
        - |
          import json, os, sys, urllib.error, urllib.request

          REQUIRED = ("snp-embed", "snp-llm")
          key = os.environ["LITELLM_MASTER_KEY"]
          broken = []
          for group in REQUIRED:
              request = urllib.request.Request(
                  "http://localhost:4000/health?model=" + group,
                  headers={"Authorization": "Bearer " + key},
              )
              try:
                  with urllib.request.urlopen(request, timeout=10) as response:
                      data = json.load(response)
              except urllib.error.HTTPError as exc:
                  if exc.code == 503:
                      broken.append(group + ": no healthy deployment")
                      continue
                  sys.exit("%s: /health returned %s" % (group, exc.code))
              except Exception as exc:
                  sys.exit("%s: health endpoint unreachable (%s)" % (group, exc))
              if data.get("unhealthy_count", 1) or not data.get("healthy_count", 0):
                  broken.append("%s: %s" % (group, data.get("unhealthy_endpoints")))
          if broken:
              sys.exit("unhealthy required routes: " + "; ".join(broken))
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 90s
      # Probe often while starting so a healthy proxy is marked healthy in
      # seconds rather than after a full interval; steady state stays at 30s.
      start_interval: 5s

  # ── Scout — the RAG bridge; the ONLY door into rag (R-4.1, R-4.2) ─
  # Agent-facing MCP exposing exactly one tool, `rag_fetch`. It reaches
  # PostgreSQL 16 + pgvector directly using fail-closed RLS and post-
  # filters every result to the addressed file (R-4.3).
  scout:
    build:
      context: .
      dockerfile: scout/Dockerfile
      args:
        # Stamped into org.opencontainers.image.revision so a stale image is
        # detectable (scripts/preflight_stack.py). Unset in an export-only
        # checkout, which the preflight reports as unverifiable, not as healthy.
        SNP_GIT_REVISION: ${SNP_GIT_REVISION:-unknown}
    image: ${SNP_SCOUT_IMAGE:-snp-scout}
    restart: unless-stopped
    environment:
      RAG_BACKEND: pgvector
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-snp_rag}
      POSTGRES_QUERY_USER: rag_app_role
      POSTGRES_QUERY_PASSWORD_FILE: /run/secrets/postgres_query_password
      LITELLM_BASE_URL: http://litellm:4000/v1
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?set LITELLM_MASTER_KEY}
      SCOUT_AUTH_MODE: ${SCOUT_AUTH_MODE:-jwt}
      SCOUT_AUTH_BASE_URL: ${SCOUT_AUTH_BASE_URL:-http://localhost:8080/mcp}
      SCOUT_STATIC_TOKENS_FILE: /run/secrets/scout_static_tokens_json
      SCOUT_JWT_ALGORITHM: ${SCOUT_JWT_ALGORITHM:-RS256}
      SCOUT_JWT_JWKS_URI: ${SCOUT_JWT_JWKS_URI:-}
      SCOUT_JWT_ISSUER: ${SCOUT_JWT_ISSUER:-}
      SCOUT_JWT_AUDIENCE: ${SCOUT_JWT_AUDIENCE:-}
      SCOUT_JWT_DEPARTMENT_CLAIM: ${SCOUT_JWT_DEPARTMENT_CLAIM:-departments}
      SCOUT_HOST: 0.0.0.0
      SCOUT_PORT: "8080"
    ports:
      - "127.0.0.1:${SCOUT_PORT:-8080}:8080"
    volumes:
      # V3: wiki_read serves page bodies from the vault, never from the index.
      # Chunk text is stripped at split (chunker.py:184), so a page cannot be
      # reassembled byte-exact from its chunks. Read-only by construction --
      # nothing writes back up the chain (INV-1).
      - vault-replica:/vault-replica:ro
    secrets:
      - postgres_query_password
      - scout_static_tokens_json
    depends_on:
      postgres-migrate:
        condition: service_completed_successfully
      litellm:
        condition: service_healthy
      host-sync:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8080), 2).close()"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 15s

  # ── sync-job — Nhịp A auto-ingest (T-3.2, R-6.1) ───────────────────
  # Same image as scout: watches raw/ and triggers a direct V2
  # PostgreSQL reindex on every change so dropped files are seen automatically.
  sync-job:
    image: ${SNP_SCOUT_IMAGE:-snp-scout}
    restart: unless-stopped
    command: ["python", "-m", "scout.sync_job"]
    environment:
      RAG_BACKEND: pgvector
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-snp_rag}
      POSTGRES_INGEST_USER: rag_ingest_role
      POSTGRES_INGEST_PASSWORD_FILE: /run/secrets/postgres_ingest_password
      LITELLM_BASE_URL: http://litellm:4000/v1
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?set LITELLM_MASTER_KEY}
      RAW_DIR: /data/raw
      # Document ACL map (audit M1). Ingestion has no department of its own:
      # this file decides each document's allowed_depts, and a file matching no
      # rule is NOT indexed — an ingest that cannot read its policy publishes
      # nothing rather than publishing everything as the public `all` ACL.
      RAW_ACL_FILE: ${RAW_ACL_FILE:-/data/raw/.acl.yaml}
      SYNC_READY_FILE: /tmp/snp-sync-job/ready
    volumes:
      - ./raw:/data/raw:ro           # watch raw/ ONLY, read-only (R-3.1)
    secrets:
      - postgres_ingest_password
    depends_on:
      postgres-migrate:
        condition: service_completed_successfully
      litellm:
        condition: service_healthy
    healthcheck:
      # The marker is written only after a cold-start sync succeeds and is
      # cleared while a retry is pending, so this reports the real state: a
      # process waiting on a dependency stays up and reads `unhealthy` instead
      # of vanishing into a restart loop (see scout/sync_job.py::_async_main).
      test: ["CMD-SHELL", "test -f /tmp/snp-sync-job/ready"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 30s
      start_interval: 2s

  # ── host-sync — Zero-Credential Git Puller (Phase 1) ─────────────
  host-sync:
    build:
      context: ./scripts
      dockerfile: Dockerfile.sync
      args:
        SNP_GIT_REVISION: ${SNP_GIT_REVISION:-unknown}
    image: ${SNP_HOST_SYNC_IMAGE:-snp-host-sync}
    restart: unless-stopped
    environment:
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:?set WEBHOOK_SECRET}
      VAULT_REPLICA_DIR: /vault-replica
      GIT_SYNC_URL: ${GIT_SYNC_URL:?set GIT_SYNC_URL}
      GIT_REMOTE: origin
      GIT_BRANCH: ${GIT_BRANCH:?set GIT_BRANCH}
    ports:
      - "127.0.0.1:${HOST_SYNC_PORT:-9000}:9000"
    volumes:
      - vault-replica:/vault-replica
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  # ── PostgreSQL 16 + pgvector — V2 Hybrid RAG Store (Phase 2) ─────
  postgres:
    image: pgvector/pgvector:pg16@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-snp_rag}
      POSTGRES_USER: ${POSTGRES_MIGRATION_USER:-postgres}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_admin_password
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    secrets:
      - postgres_admin_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_MIGRATION_USER:-postgres} -d ${POSTGRES_DB:-snp_rag}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  postgres-migrate:
    image: ${SNP_SCOUT_IMAGE:-snp-scout}
    restart: "no"
    command:
      - sh
      - -ec
      - python scripts/migrate_postgres.py && python scripts/provision_postgres_roles.py
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-snp_rag}
      POSTGRES_MIGRATION_USER: ${POSTGRES_MIGRATION_USER:-postgres}
      POSTGRES_MIGRATION_PASSWORD_FILE: /run/secrets/postgres_admin_password
      POSTGRES_QUERY_USER: rag_app_role
      POSTGRES_QUERY_PASSWORD_FILE: /run/secrets/postgres_query_password
      POSTGRES_INGEST_USER: rag_ingest_role
      POSTGRES_INGEST_PASSWORD_FILE: /run/secrets/postgres_ingest_password
    secrets:
      - postgres_admin_password
      - postgres_query_password
      - postgres_ingest_password
    depends_on:
      postgres:
        condition: service_healthy

  # ── Gitea Actions Runner — Phase 3 Auto-Healer CI Runner ──────────
  gitea-runner:
    image: gitea/act_runner:0.2.11@sha256:eabea0883261fa3378849a1b9ce86dce6a2e906c8db48ad8553edc3f2bd9ff68
    restart: unless-stopped
    environment:
      GITEA_INSTANCE_URL: ${GITEA_INSTANCE_URL:-http://git:3000}
      GITEA_RUNNER_REGISTRATION_TOKEN: ${GITEA_RUNNER_REGISTRATION_TOKEN:-}
      GITEA_RUNNER_NAME: snp-auto-healer-runner
      CONFIG_FILE: /config.yaml
    volumes:
      - ./config/gitea/runner-config.yaml:/config.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - runner-data:/data
    depends_on:
      git:
        condition: service_healthy
    profiles:
      - runner

# ─────────────────────────────────────────────────────────────────────
# R-9.3: if the company already runs GitLab, delete the `git` service and
# point WIKI_REMOTE at the existing GitLab repo — nothing else changes.
# The wiki vault is not a service (R-9.2); host-sync publishes it into the
# isolated read-only replica consumed by scout.
# ─────────────────────────────────────────────────────────────────────

volumes:
  gitea-data:
  rag-storage:
  rag-hf-cache:
  pgdata:
  runner-data:
  vault-replica:

secrets:
  postgres_admin_password:
    file: ./.secrets/postgres_admin_password
  postgres_query_password:
    file: ./.secrets/postgres_query_password
  postgres_ingest_password:
    file: ./.secrets/postgres_ingest_password
  scout_static_tokens_json:
    file: ./.secrets/scout_static_tokens.json
