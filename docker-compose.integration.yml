# Disposable integration project. Compose merges port lists additively, so a
# service that publishes here without `!override` keeps the base publication
# too and races the live stack for 4000/8080/9000/8765. Whichever project loses
# either fails to start or -- far worse -- leaves the integration tests pointed
# at the live stack. `!override` replaces the list instead of extending it, the
# same fix docker-compose.staging.yml uses for the same reason.

services:
  postgres:
    ports: !override
      - "127.0.0.1:${SNP_INTEGRATION_POSTGRES_PORT:-55432}:5432"

  postgres-migrate:
    environment:
      SNP_INTEGRATION_PROJECT: snp-memory-it

  litellm:
    ports: !override
      - "127.0.0.1:${SNP_INTEGRATION_LITELLM_PORT:-54000}:4000"

  scout:
    ports: !override
      - "127.0.0.1:${SNP_INTEGRATION_SCOUT_PORT:-58080}:8080"
    environment:
      SCOUT_AUTH_MODE: static
      SCOUT_AUTH_BASE_URL: http://127.0.0.1:${SNP_INTEGRATION_SCOUT_PORT:-58080}/mcp
      SCOUT_STATIC_TOKENS_FILE: /run/secrets/scout_static_tokens_json
    secrets:
      - scout_static_tokens_json

  host-sync:
    ports: !override
      - "127.0.0.1:${SNP_INTEGRATION_HOST_SYNC_PORT:-59000}:9000"
    environment:
      GIT_SYNC_URL: file:///source-repo
      GIT_BRANCH: ${SNP_INTEGRATION_GIT_BRANCH:-main}
      GIT_CONFIG_GLOBAL: /etc/snp/integration.gitconfig
    volumes:
      - ./:/source-repo:ro
      - ./config/host-sync.integration.gitconfig:/etc/snp/integration.gitconfig:ro
