apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: vllm-inference-cluster
  namespace: ai-platform
  labels:
    app.kubernetes.io/name: vllm-engine
    app.kubernetes.io/component: inference
spec:
  serviceName: vllm-headless
  replicas: 4
  selector:
    matchLabels:
      app: vllm-engine
  template:
    metadata:
      labels:
        app: vllm-engine
    spec:
      containers:
      - name: vllm-worker
        image: vllm/vllm-openai:v0.7.2
        args:
        - "--model"
        - "meta-llama/Llama-3.3-70B-Instruct"
        - "--tensor-parallel-size"
        - "4"
        - "--gpu-memory-utilization"
        - "0.92"
        - "--max-model-len"
        - "16384"
        - "--enable-prefix-caching"
        - "--block-size"
        - "16"
        ports:
        - containerPort: 8000
          name: http
        resources:
          limits:
            nvidia.com/gpu: "4"
            memory: 128Gi
            cpu: "32"
          requests:
            nvidia.com/gpu: "4"
            memory: 64Gi
            cpu: "16"
---
apiVersion: v1
kind: Service
metadata:
  name: vllm-service
  namespace: ai-platform
spec:
  type: ClusterIP
  selector:
    app: vllm-engine
  ports:
  - port: 8000
    targetPort: http
