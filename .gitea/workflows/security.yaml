name: Secret Security Gate

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout target repository and complete history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0
          persist-credentials: false
          path: target

      # Security code and detector configuration must come from a trusted ref,
      # never from the pull-request/feature branch being inspected.
      - name: Checkout trusted security implementation
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          ref: ${{ github.base_ref || github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false
          path: trusted-security

      - name: Scan working tree, index, untracked files, and all refs
        run: |
          cd "$GITHUB_WORKSPACE/trusted-security"
          python3 scripts/scan_secrets.py --all-current --history --repo "$GITHUB_WORKSPACE/target"

      - name: Independent Gitleaks all-history scan
        if: always()
        env:
          GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.24.3@sha256:e1b35e12a8c6fa8901f060459cfb6b2fc4c484d3afbe3b029733a3bbfab07055
        # act_runner runs this step inside a job container that talks to the
        # HOST's Docker daemon. A `--volume "$GITHUB_WORKSPACE/..."` bind mount
        # names a job-container path the daemon resolves on the host, where it
        # does not exist: Docker creates an empty directory and gitleaks
        # "passes" over nothing. `docker cp` streams from this side of the API,
        # so the scanner receives the real checkout and the trusted config
        # whichever filesystem the daemon sees.
        run: |
          set -eu
          if ! git -C "$GITHUB_WORKSPACE/target" rev-parse --verify --quiet HEAD >/dev/null; then
            echo "target checkout has no commit history; refusing to report a scan of nothing" >&2
            exit 1
          fi
          docker pull "$GITLEAKS_IMAGE"
          trusted_dir="$(mktemp -d)"
          cp "$GITHUB_WORKSPACE/trusted-security/.gitleaks.toml" "$trusted_dir/gitleaks.toml"
          cid="$(docker create --workdir /repo \
            "$GITLEAKS_IMAGE" git "--log-opts=--all --root" --redact --no-banner . --config=/trusted/gitleaks.toml)"
          trap 'docker rm --force "$cid" >/dev/null 2>&1 || true' EXIT
          docker cp "$GITHUB_WORKSPACE/target/." "$cid:/repo"
          docker cp "$trusted_dir" "$cid:/trusted"
          # gitleaks' exit status is the step's status; the trap only cleans up.
          docker start --attach "$cid"
