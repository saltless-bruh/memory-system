<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="100%">
  <defs>
    <style>
      .box { fill: #1e293b; stroke: #38bdf8; stroke-width: 2; rx: 8; }
      .layer { fill: #0f172a; stroke: #64748b; stroke-width: 1.5; rx: 12; }
      .text-title { font-family: sans-serif; font-size: 16px; font-weight: bold; fill: #f8fafc; }
      .text-body { font-family: sans-serif; font-size: 12px; fill: #94a3b8; }
      .arrow { stroke: #38bdf8; stroke-width: 2; marker-end: url(#arrowhead); fill: none; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#38bdf8" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="800" height="400" fill="#020617" rx="16"/>

  <!-- Layer 1: Knowledge Vault -->
  <rect x="50" y="50" width="320" height="300" class="layer"/>
  <text x="70" y="85" class="text-title">Layer 1: Knowledge Vault (Wiki)</text>
  <text x="70" y="110" class="text-body">Git-backed Markdown + SQLite Knowledge Graph</text>
  
  <rect x="70" y="130" width="280" height="60" class="box"/>
  <text x="85" y="155" class="text-title">basic-memory (Port 8765)</text>
  <text x="85" y="175" class="text-body">Entity graph, wikilinks, top-K navigation</text>

  <rect x="70" y="210" width="280" height="60" class="box"/>
  <text x="85" y="235" class="text-title">Atomic Notes &amp; Manifests</text>
  <text x="85" y="255" class="text-body">index.md, concepts, techniques, playbooks</text>

  <!-- Layer 2: Raw Evidence Warehouse -->
  <rect x="430" y="50" width="320" height="300" class="layer"/>
  <text x="450" y="85" class="text-title">Layer 2: Raw Warehouse (RAG)</text>
  <text x="450" y="110" class="text-body">PostgreSQL 16 + pgvector + Scout Middleware</text>

  <rect x="450" y="130" width="280" height="60" class="box"/>
  <text x="465" y="155" class="text-title">Scout MCP (Port 8080)</text>
  <text x="465" y="175" class="text-body">Hybrid Search (HNSW + tsvector RRF)</text>

  <rect x="450" y="210" width="280" height="60" class="box"/>
  <text x="465" y="235" class="text-title">PostgreSQL 16 Database</text>
  <text x="465" y="255" class="text-body">3072-dim Gemini embeddings + RLS</text>

  <!-- Connecting Arrows -->
  <path d="M 350 160 L 450 160" class="arrow"/>
  <text x="365" y="150" class="text-body" fill="#38bdf8">rag_fetch</text>
</svg>
