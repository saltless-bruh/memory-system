# LiteLLM — AI gateway / chokepoint (T-0.2 → R-8.1)
#
# Three routes, all terminating on Cloud APIs via LiteLLM.
# If a call cannot be served by one of these, it must fail.
# Consumers:
#   snp-embed  → Scout-DIY summaries + PostgreSQL pgvector chunks
#   snp-llm    → compile-on-demand page extraction
#   snp-vlm    → supported multimodal extraction workloads
#
# NOT routed here (by design, do not "fix" this):
#   · basic-memory FastEmbed — in-process, local, no egress (R-8.2)
#   · the member's own coding-agent model — outside the system
#     boundary entirely (R-8.3)

# NOTE on env vars: LiteLLM only substitutes the `os.environ/NAME` form,
# and only as a whole value — it does NOT interpolate `${NAME}` inside a
# string. We use os.environ/LITELLM_EMBED_MODEL, etc. to configure models.
model_list:
  # ── Embedding: Cloud Embedding Model ────
  - model_name: snp-embed
    litellm_params:
      model: os.environ/LITELLM_EMBED_MODEL
      dimensions: 1024
    model_info:
      mode: embedding

  # ── Text LLM: entity + relation extraction for the KG ─────────────
  - model_name: snp-llm
    litellm_params:
      model: os.environ/LITELLM_LLM_MODEL
    model_info:
      mode: chat

  # ── Judge: faithfulness gate for compiled pages ───────────────────
  # Deliberately a DIFFERENT model family from snp-llm. An LLM judging its
  # own output scores it higher (self-preference bias), so a judge sharing
  # snp-llm's family would rubber-stamp the prose snp-llm just wrote.
  - model_name: snp-judge
    litellm_params:
      model: os.environ/LITELLM_JUDGE_ROUTE_MODEL
      api_key: os.environ/OPENROUTER_API_KEY
    model_info:
      mode: chat
      # Excluded from the BACKGROUND health loop only. That loop probes every
      # group every `health_check_interval` seconds — 288 real requests a day
      # at 300s — and this route runs on an OpenRouter free key, whose ceiling
      # is 50 requests/day without purchased credits. Monitoring would consume
      # roughly six times the daily budget before a single page was judged, and
      # would then report the route unhealthy for the rest of the day.
      # CORRECTED 2026-08-26: an on-demand `GET /health?model=snp-judge` does
      # NOT probe it. That endpoint serves the *cached* result of the background
      # loop, and this route is excluded from that loop — so it answers 503
      # whether the judge is up or down. The honest reading of that 503 is
      # "unknown", not "unhealthy".
      #
      # To actually ask, spend one request deliberately:
      #     uv run python scripts/verify_groundedness.py --probe
      # exit 0 = the judge answered, exit 2 = it did not. That is also what
      # `ci_address_gate.py` runs as a preflight, before any heal can mutate
      # `sources[]` on the strength of a check that never happened.
      disable_background_health_check: true

  # ── VLM: multimodal → text before grounding (proposal §2.3) ───────
  # Recall quality downstream depends on this caption step, so keep it
  # a real VLM, not a text model pretending.
  - model_name: snp-vlm
    litellm_params:
      model: os.environ/LITELLM_VLM_MODEL
    model_info:
      mode: chat
      supports_vision: true

litellm_settings:
  # Disable LiteLLM telemetry; provider calls still follow configured cloud routes.
  telemetry: false
  drop_params: true
  request_timeout: 600
  # No fallback list on purpose: a provider/model failure must surface.
  num_retries: 2

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  # Health checks run on a timer and `/health` serves the cached result, so the
  # container probe costs nothing per call. Without this every probe would make
  # a real request to every provider.
  background_health_checks: true
  health_check_interval: 300
