title = "SNP Memory System secret scanning"

[extend]
useDefault = true

[[rules]]
id = "snp-openai-compatible-token"
description = "OpenAI-compatible token with a 20-character or longer suffix"
regex = '''\bsk-[A-Za-z0-9_-]{20,}\b'''

# Placeholder exceptions require both an approved example path and a visibly fake
# value. There are no fixture, password-name, or repository-wide exemptions.
[allowlist]
description = "Documented example values in example configuration only"
condition = "AND"
regexTarget = "match"
paths = [
    '''^\.env\.example$''',
    '''^docker-compose\.yml$''',
]
regexes = [
    '''^sk-local-dev-[a-z0-9-]+$''',
    '''^sk-placeholder-[a-z0-9-]+$''',
    '''^sk-synthetic-[a-z0-9-]+$''',
]

# NOTE, 2026-09-15: this allowlist still carries `condition = "AND"` with a
# `paths` restriction, while scripts/scan_secrets.py deliberately dropped its
# path condition (audit finding M6) because it left that gate permanently red.
# The two are therefore NOT equivalent: a placeholder outside .env.example or
# docker-compose.yml is exempt for scan_secrets.py and reported by gitleaks.
# Recorded rather than silently reconciled -- gitleaks has never actually run
# here (defect #26), so tightening or loosening it now would be a change nobody
# has ever observed the effect of.
