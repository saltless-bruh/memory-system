name: Secret Security Gate

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout target repository and complete history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          path: target

      # Security code and detector configuration must come from a trusted ref,
      # never from the pull-request/feature branch being inspected.
      - name: Checkout trusted security implementation
        uses: actions/checkout@v4
        with:
          ref: ${{ github.base_ref || github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false
          path: trusted-security

      - name: Scan working tree, index, untracked files, and all refs
        run: |
          cd "$GITHUB_WORKSPACE/trusted-security"
          python3 scripts/scan_secrets.py --all-current --history --repo "$GITHUB_WORKSPACE/target"

      - name: Independent Gitleaks all-history scan
        if: always()
        env:
          GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.24.3@sha256:e1b35e12a8c6fa8901f060459cfb6b2fc4c484d3afbe3b029733a3bbfab07055
        run: |
          docker pull "$GITLEAKS_IMAGE"
          docker run --rm \
            --volume "$GITHUB_WORKSPACE/target:/repo:ro" \
            --volume "$GITHUB_WORKSPACE/trusted-security/.gitleaks.toml:/trusted/gitleaks.toml:ro" \
            --workdir /repo \
            "$GITLEAKS_IMAGE" git "--log-opts=--all --root" --redact --no-banner . --config=/trusted/gitleaks.toml
