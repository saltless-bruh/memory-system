[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "snp-memory-system"
version = "0.1.0"
description = "SNP Memory System (V1) — Dual-layer Wiki + RAG Shared Knowledge System"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # fastmcp is pinned at 3.3.1 for Streamable HTTP transport and MCP output schema stability
    "fastmcp==3.3.1",
    "watchfiles>=0.21",
    "pyyaml>=6.0",
    "tiktoken>=0.7.0",
    "asyncpg>=0.29.0",
    "pypdf>=4.0.0",
    "fastapi>=0.110.0",
    "httpx>=0.27.0",
    "uvicorn>=0.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
    "ruff>=0.4",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["scout*", "scripts*", "spikes*"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["lightrag.*", "asyncpg.*", "pypdf.*", "watchfiles.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ASYNC240", "ASYNC221"]
"scripts/*" = ["ASYNC240", "ASYNC221", "E402"]
"docs/*" = ["E501"]
"rag/*" = ["ASYNC240"]
