[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "snp-memory-system"
version = "0.1.0"
description = "SNP Memory System (V2) — Dual-layer Wiki + PostgreSQL 16 pgvector Knowledge Platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # fastmcp is pinned at 3.3.1 for Streamable HTTP transport and MCP output schema stability
    "fastmcp==3.3.1",
    "watchfiles>=0.21",
    "pyyaml>=6.0",
    "tiktoken>=0.7.0",
    "asyncpg>=0.29.0",
    "pypdf>=4.0.0",
    # Pillow is what makes PDF figure extraction possible at all: pypdf raises
    # ImportError from page.images without it, which is why figures previously
    # appeared to "crash" the parser.
    "pillow>=10.0.0",
    # pdfplumber supplies glyph and ruling-line geometry. Tables are rebuilt
    # from coordinates rather than transcribed by a model, so no cell value is
    # ever generated (scout/pdf_structure.py).
    "pdfplumber>=0.11",
    "fastapi>=0.110.0",
    "httpx>=0.27.0",
    "uvicorn>=0.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-socket>=0.7",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
    "ruff>=0.4",
]
# Optional benchmark stack for `tests/eval_ragas.py` only. Kept out of `dev` so
# the deterministic offline gates never depend on it; the benchmark names this
# extra and exits 2 when it is absent rather than reporting a hollow success.
eval = [
    "ragas>=0.2,<0.3",
    "datasets>=2.19",
    "langchain-openai>=0.1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["scout*", "scripts*", "spikes*"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = "--disable-socket --allow-unix-socket"
testpaths = ["tests"]
markers = [
    "integration: marks integration tests",
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["asyncpg.*", "pypdf.*", "watchfiles.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ASYNC240", "ASYNC221"]
"scripts/*" = ["ASYNC240", "ASYNC221", "E402"]
"docs/*" = ["E501"]
"rag/*" = ["ASYNC240"]
